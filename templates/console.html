{{template "head" .}}
<h1>{{.T "page.console"}}</h1>
<p class="muted">{{.TH "console.hint" "user" .User}}</p>

<div class="card">
	<form method="post" action="{{.Prefix}}/console" class="row">
		<input type="hidden" name="csrf" value="{{.CSRF}}">
		<input name="command" class="mono grow" value="{{.Data.Command}}" placeholder="network status" autofocus required>
		<button class="primary">{{.T "console.run"}}</button>
	</form>
	{{with .Data.Error}}<p class="flash bad">{{.}}</p>{{end}}
	{{with .Data.Output}}<pre class="out">{{range .}}{{.}}
{{end}}</pre>{{end}}
</div>
{{template "foot" .}}
