{{template "head" .}}
<div class="card narrow">
	<h1>soju-webadmin</h1>
	<p class="muted">Sign in with your soju account on <code>{{.Data.Addr}}</code>.</p>
	{{with .Data.Error}}<p class="flash bad">{{.}}</p>{{end}}
	<form method="post" action="{{.Prefix}}/login">
		<label>Username
			<input name="username" autocomplete="username" autofocus required value="{{.Data.Username}}">
		</label>
		<label>Password
			<input name="password" type="password" autocomplete="current-password" required>
		</label>
		<button class="primary">Sign in</button>
	</form>
</div>
{{template "foot" .}}
