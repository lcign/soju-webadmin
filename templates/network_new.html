{{template "head" .}}
<div class="bar"><h1>{{.T "page.add_network"}}</h1><a class="button" href="{{.Prefix}}/">{{.T "act.cancel"}}</a></div>

<div class="card">
	<form method="post" action="{{.Prefix}}/networks/new">
		<input type="hidden" name="csrf" value="{{.CSRF}}">
		<div class="grid">
			<label>{{.T "net.host"}} <span class="req">{{.T "net.required"}}</span>
				<input name="host" placeholder="irc.libera.chat" required autofocus>
			</label>
			<label>{{.T "net.port"}}
				<input name="port" inputmode="numeric" placeholder="6697">
			</label>
			<label>{{.T "net.name"}}
				<input name="name" placeholder="libera">
				<small>{{.T "net.name_hint"}}</small>
			</label>
			<label class="check">
				<input type="checkbox" name="tls" value="1" checked> {{.T "net.tls"}}
			</label>
			<label>{{.T "net.nickname"}}
				<input name="nickname" placeholder="{{.T "net.nickname_placeholder"}}">
			</label>
			<label>{{.T "net.username"}}
				<input name="username">
			</label>
			<label>{{.T "net.realname"}}
				<input name="realname">
			</label>
			<label>{{.T "net.pass"}}
				<input name="pass" type="password" autocomplete="new-password">
				<small>{{.T "net.pass_hint"}}</small>
			</label>
		</div>
		<button class="primary">{{.T "net.add"}}</button>
	</form>
</div>
{{template "foot" .}}
